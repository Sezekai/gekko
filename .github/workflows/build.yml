name: Build Gekko

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.16.0 pytest

      - name: Download FFmpeg, libmpv and fpcalc
        run: python build/fetch_tools.py

      - name: Tests (library, Tidy up, playback, the window)
        shell: pwsh
        run: |
          $env:PATH = "$PWD\bin;$env:PATH"
          python -X faulthandler -m pytest -q tests
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Real playback through libmpv (gapless)
        shell: pwsh
        run: |
          $env:PATH = "$PWD\bin;$env:PATH"
          $env:QT_QPA_PLATFORM = "windows"
          $env:GEKKO_MPV_AO = "null"
          python -u tests/mpv_check.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Screenshots at 1100, 1440 and 1920 wide (real window)
        continue-on-error: true
        shell: pwsh
        run: |
          $env:PATH = "$PWD\bin;$env:PATH"
          $env:QT_QPA_PLATFORM = "windows"
          python -u tests/screenshots.py "$PWD\shots" 2>&1 | Out-String -Stream
          "exit code: $LASTEXITCODE"

      - name: Build app
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build/work build/gekko.spec

      - name: Self-test the built app
        timeout-minutes: 6
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\App\Gekko.exe" -ArgumentList "--selftest", "$PWD\selftest.json" -PassThru
          if (-not $p.WaitForExit(240000)) { "Gekko is still running after 4 minutes"; $p.Kill() }
          Get-Content selftest.json
          if (Test-Path selftest.json.hang.txt) { Get-Content selftest.json.hang.txt }
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }

      - name: Package
        id: pkg
        shell: pwsh
        run: |
          $ver = (Select-String -Path gekko/__init__.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$ver" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force out/Gekko | Out-Null
          Copy-Item -Recurse dist/App out/Gekko/App
          Copy-Item README.md out/Gekko/README.txt
          Compress-Archive -Path out/Gekko -DestinationPath "Gekko.zip" -CompressionLevel Optimal
          Get-Item "Gekko.zip" | Select-Object Name, Length

      # Numbered releases (STANDARDS.md): each version gets its own tag and release, kept for going back.
      # The newest is always at https://github.com/Sezekai/gekko/releases/latest/download/Gekko.zip
      - name: Tag this version
        shell: pwsh
        run: |
          $tag = "v${{ steps.pkg.outputs.version }}"
          git tag -f $tag
          git push -f origin $tag

      - name: Publish this version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: Gekko ${{ steps.pkg.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: Gekko.zip
          overwrite_files: true
          make_latest: true
